name: Verify

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: format
        run: deno fmt --check

      - name: lint
        run: deno lint

      - name: check
        run: deno check mod.ts

      - name: test
        run: deno task test

  diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: install node diagnostics
        run: npm install
        working-directory: diagnostics/node-ts5

      - name: check node diagnostics
        run: npm run check
        working-directory: diagnostics/node-ts5

      - name: run node diagnostics
        run: npm run diagnostics:all
        working-directory: diagnostics/node-ts5
